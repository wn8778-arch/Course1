<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원산지 청렴도 제고를 위한 담당자 교육</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--al:#f3f7f9;--sf:#fff;--tx:#12303c;--mu:#546b75;--ln:#cfdce1;--pr:#0b4f6c;--pt:#fff;--ok:#1b7f5c;--no:#b93a26;--hl:#dcebf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:18px/1.7 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.w{max-width:720px;margin:0 auto;padding:0 18px}
header{background:#9ad5f5;color:#0b3a52;padding:18px 0 14px}
h1{margin:0;font-size:min(22px,calc((100vw - 36px)/19.5));font-weight:900;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.7);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#0b4f6c;transition:width .4s}
#pl{font-size:14px;margin-top:4px}
.lk{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
#st{display:flex;gap:8px;padding:14px 0 4px}
#st button{flex:1;border:2px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:8px 0;font:inherit;font-size:13px;line-height:1.3;cursor:pointer}
#st button span{display:block;font-size:22px}
#st button[disabled]{opacity:.4;cursor:not-allowed}
#st button.on{border-color:var(--pr);background:var(--hl);font-weight:700}
#st button.dn{border-color:var(--ok);background:#e6f5ee}
.card{background:var(--sf);border:1px solid var(--ln);box-shadow:none;border-radius:16px;padding:22px 18px;margin:12px 0}
.sub{color:var(--mu);font-size:14px;margin:0}
h2{font-size:24px;margin:4px 0 14px;line-height:1.35}
p{margin:8px 0}
.big{font-size:34px;font-weight:900;color:var(--pr);line-height:1.2}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.g>div{background:var(--al);border-radius:12px;padding:12px;text-align:center}
.g .e{font-size:30px;display:block}
.hi{background:var(--hl);border-radius:12px;padding:12px 14px;margin:12px 0}
.ex{border-radius:10px;padding:10px 12px;margin:8px 0;border-left:6px solid}
.ex.o{border-color:var(--ok);background:var(--al)}.ex.x{border-color:var(--no);background:var(--al)}
.ex b{display:block;font-size:14px}
.o b{color:var(--ok)}.x b{color:var(--no)}
.st{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.st i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pr);color:var(--pt);display:grid;place-items:center;font-style:normal;font-weight:900}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch span{background:var(--al);border:1px solid var(--ln);border-radius:16px;padding:2px 12px;font-size:16px}
.ox{display:flex;gap:12px;margin-top:14px}
.ox button{flex:1;font:inherit;font-size:48px;font-weight:900;border:3px solid var(--ln);border-radius:16px;background:var(--al);color:var(--tx);padding:12px 0;cursor:pointer}
.ox button.r{border-color:var(--ok);background:var(--hl);color:var(--ok)}
.ox button.w{border-color:var(--no);color:var(--no)}
#fb{margin-top:12px;font-weight:700;min-height:1.7em}
.nv{display:flex;gap:10px;margin:8px 0 14px}
.lg{text-align:right;margin:0 0 40px}.lg img{height:34px;width:auto}
.nv button,.ng{flex:1;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;background:#9ad5f5;color:#0b3a52}
.nv button.sec{background:var(--sf);color:var(--tx);border:2px solid var(--ln);flex:0 0 30%}
.nv button[disabled]{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input{display:block;width:100%;margin:6px 0 14px;padding:12px;border:2px solid var(--ln);border-radius:10px;background:var(--al);color:var(--tx);font:inherit}
.cp{background:#fff;color:#12303c;border:4px double #0b4f6c;padding:34px 18px;text-align:center;border-radius:8px}
.cp h2{font-size:34px;color:#0b4f6c;letter-spacing:.3em;margin:0 0 20px}
.cp .nm{font-size:30px;font-weight:900;border-bottom:2px solid #12303c;display:table;padding:0 8px 4px;margin:10px 0 10px auto;font-size:min(20px,5vw)}
.cp p{color:#12303c}
.fp{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.fp img{width:92px;height:auto;flex:none}
.bb{position:relative;background:var(--hl);border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.5;font-size:17px}
.bb::before{content:"";position:absolute;left:-8px;bottom:22px;border:8px solid transparent;border-right-color:var(--hl);border-left:0}
.rl button{font-size:18px;padding:14px 0;margin-bottom:6px}
.rl button.sel{border-color:var(--pr);background:var(--hl);font-weight:700;color:var(--pr)}
@media print{header,#st,.np{display:none!important}body,:root{background:#fff!important;padding:0!important}}
</style>
</head>
